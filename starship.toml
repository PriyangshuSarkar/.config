# ──────────────────────────────
# 🌍 Global Settings
# ──────────────────────────────
# No custom palette: One Dark is applied at the terminal layer (ghostty
# `theme = Atom One Dark`, tmux onedark-theme plugin), so the generic
# ANSI color names below already render as One Dark hues.

format = """
$directory\
$git_status\
$git_branch\
$git_state\
$fill\
$cmd_duration\
$time\
$line_break\
$line_break\
$character
"""

# ──────────────────────────────
# 📁 Core Segments
# ──────────────────────────────

[directory]
truncation_length = 4
style = "fg:black bg:green"
format = "[ 󰉋 $path ]($style)"

[git_status]
style = "fg:white bg:black"
format = "[ $all_status$ahead_behind ]($style)"

[git_branch]
style = "fg:black bg:yellow"
format = "[  $branch ]($style)"

[git_state]
style = "fg:black bg:red"
format = "[ ⚡$state( $progress_current/$progress_total) ]($style)"

[fill]
symbol = "  "

[time]
disabled = false
format = "[ 󰥔 $time ]($style)"
style = "fg:black bg:bright-black"
time_format = "%H:%M"

[cmd_duration]
disabled = false
min_time = 0
format = "[ 󱦟 $duration ]($style)"
style = "fg:black bg:red"

# ──────────────────────────────
# 💻 UI / Visual
# ──────────────────────────────

[character]
disabled = false
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold red)"
vimcmd_replace_symbol = "[❮](bold red)"
vimcmd_visual_symbol = "[❮](bold yellow)"
