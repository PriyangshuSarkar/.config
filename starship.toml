# ──────────────────────────────
# 🌍 Global Settings
# ──────────────────────────────
format = """
$directory\
$git_status\
$git_branch\
$git_state\
$fill\
$cmd_duration\
$time\
$line_break\
$line_break\
$character
"""

# ──────────────────────────────
# 📁 Core Segments
# ──────────────────────────────

[directory]
truncation_length = 4
style = "fg:black bg:purple"
format = "[ 󰉋 $path ]($style)"

[git_status]
style = "fg:white bg:black"
format = "[ $all_status$ahead_behind ]($style)"

[git_branch]
style = "fg:black bg:blue"
format = "[  $branch ]($style)"

[git_state]
style = "fg:black bg:yellow"
format = "[ ⚡$state( $progress_current/$progress_total) ]($style)"

[fill]
symbol = "  "

[time]
disabled = false
format = "[ 󰥔 $time ]($style)"
style = "fg:black bg:bright-purple"
time_format = "%H:%M"

[cmd_duration]
disabled = false
min_time = 0
format = "[ 󱦟 $duration ]($style)"
style = "fg:black bg:bright-yellow"

# ──────────────────────────────
# 💻 UI / Visual
# ──────────────────────────────

[character]
disabled = false
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"
vimcmd_replace_one_symbol = "[❮](bold fg:purple)"
vimcmd_replace_symbol = "[❮](bold fg:purple)"
vimcmd_visual_symbol = "[❮](bold fg:bright-purple)"
