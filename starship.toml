# ──────────────────────────────
# 🌍 Global Settings
# ──────────────────────────────
format = """
$directory\
([│](fg:muted bg:base)$git_status)\
([│](fg:muted bg:base)$git_branch)\
([│](fg:muted bg:base)$git_state)\
$fill\
($cmd_duration[│](fg:muted bg:base))\
$time\
$line_break\
$line_break\
$character
"""

# Semantic names map to ANSI colors (follow the terminal theme); base is the
# Catppuccin Mocha background, which has no ANSI slot
palette = "terminal"

# ──────────────────────────────
# 📁 Core Segments
# ──────────────────────────────

[directory]
truncation_length = 4
style = "fg:primary bg:base"
format = "[󰉋 $path ]($style)"

[git_status]
style = "bg:base"
format = "([ $all_status$ahead_behind ]($style))"

[git_branch]
style = "fg:secondary bg:base"
format = "[  $branch ]($style)"

[git_state]
style = "fg:warning bg:base"
format = "[ ⚡$state( $progress_current/$progress_total) ]($style)"

[fill]
symbol = "  "

[time]
disabled = false
format = "[ 󰥔 $time]($style)"
style = "bg:base"
time_format = "%H:%M"

[cmd_duration]
disabled = false
min_time = 0
format = "[ 󱦟 $duration ]($style)"
style = "fg:warning bg:base"

# ──────────────────────────────
# 💻 UI / Visual
# ──────────────────────────────

[character]
disabled = false
success_symbol = "[❯](bold fg:success)"
error_symbol = "[❯](bold fg:error)"
vimcmd_symbol = "[❮](bold fg:primary)"
vimcmd_replace_one_symbol = "[❮](bold fg:secondary)"
vimcmd_replace_symbol = "[❮](bold fg:secondary)"
vimcmd_visual_symbol = "[❮](bold fg:secondary)"

# ──────────────────────────────
# 🎨 Palette
# ──────────────────────────────

[palettes.terminal]
primary = "blue"
secondary = "purple"
base = "#1e1e2e"
muted = "bright-black"
success = "green"
warning = "yellow"
error = "red"
