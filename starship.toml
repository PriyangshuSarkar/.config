# ──────────────────────────────
# 🌍 Global Settings
# ──────────────────────────────
# Semantic names map to ANSI colors (follow the terminal theme); base is the
# Catppuccin Mocha background, which has no ANSI slot
palette = "terminal"

format = """
$directory\
$git_status\
$git_branch\
$git_state\
$fill\
$cmd_duration\
$time\
$line_break\
$line_break\
$character
"""

# ──────────────────────────────
# 📁 Core Segments
# ──────────────────────────────

[directory]
truncation_length = 4
style = "bold fg:base bg:secondary"
format = "[ 󰉋 $path ]($style)"

[git_status]
style = "bold fg:white bg:base"
format = "([ $all_status$ahead_behind ]($style))"

[git_branch]
style = "bold fg:base bg:primary"
format = "[  $branch ]($style)"

[git_state]
style = "bold fg:base bg:warning"
format = "[ ⚡$state( $progress_current/$progress_total) ]($style)"

[fill]
symbol = "  "

[time]
disabled = false
format = "[ 󰥔 $time ]($style)"
style = "bold fg:base bg:bright-purple"
time_format = "%H:%M"

[cmd_duration]
disabled = false
min_time = 0
format = "[ 󱦟 $duration ]($style)"
style = "bold fg:base bg:bright-yellow"

# ──────────────────────────────
# 💻 UI / Visual
# ──────────────────────────────

[character]
disabled = false
success_symbol = "[❯](bold fg:success)"
error_symbol = "[❯](bold fg:error)"
vimcmd_symbol = "[❮](bold fg:success)"
vimcmd_replace_one_symbol = "[❮](bold fg:purple)"
vimcmd_replace_symbol = "[❮](bold fg:purple)"
vimcmd_visual_symbol = "[❮](bold fg:bright-purple)"

# ──────────────────────────────
# 🎨 Palette
# ──────────────────────────────

[palettes.terminal]
primary = "blue"
secondary = "purple"
base = "#1e1e2e"
muted = "bright-black"
success = "green"
warning = "yellow"
error = "red"
