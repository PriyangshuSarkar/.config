# Gruvbox Dark theme for LazyGit
gui:
  theme:
    activeBorderColor:
      - "#b8bb26" # green
      - bold
    inactiveBorderColor:
      - "#928374" # gray
    optionsTextColor:
      - "#83a598" # blue
    selectedLineBgColor:
      - "#3c3836" # bg1
    cherryPickedCommitBgColor:
      - "#504945" # bg2
    cherryPickedCommitFgColor:
      - "#b8bb26" # green
    unstagedChangesColor:
      - "#fb4934" # red
    defaultFgColor:
      - "#ebdbb2" # fg
    searchingActiveBorderColor:
      - "#fabd2f" # yellow
  authorColors:
    "*": "#d3869b" # purple
