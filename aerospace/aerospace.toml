# -----------------------------
# AeroSpace Configuration File
# -----------------------------

# Start AeroSpace at login
start-at-login = true

# -----------------------------
# Startup Commands
# -----------------------------
# after-startup-command = ['exec-and-forget sketchybar']

# Notify Sketchybar about workspace change
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  # 'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
  'exec-and-forget borders',
]

# -----------------------------
# Normalization
# -----------------------------
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# -----------------------------
# Layout Defaults
# -----------------------------
accordion-padding = 0
default-root-container-layout = 'tiles' # tiles | accordion
default-root-container-orientation = 'auto' # horizontal | vertical | auto

# -----------------------------
# Mouse / Focus Behavior
# -----------------------------
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = true

# -----------------------------
# Key Mapping
# -----------------------------
[key-mapping]
preset = 'qwerty'

# -----------------------------
# Gaps (pixels)
# -----------------------------
[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 5
outer.right = 5
outer.bottom = 5
outer.top = 5

# -----------------------------
# Main Binding Mode
# -----------------------------
[mode.main.binding]
# Workspace switching (alt + number)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'

# Move window to workspace and follow focus (alt + shift + number)
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']

# Layout
alt-ctrl-shift-f = 'fullscreen'
alt-ctrl-f = 'layout floating tiling'
alt-slash = 'layout tiles'
alt-comma = 'layout accordion'

# Focus windows in workspace (alt + ctrl + hjkl/arrows)
alt-ctrl-h = 'focus left'
alt-ctrl-j = 'focus down'
alt-ctrl-k = 'focus up'
alt-ctrl-l = 'focus right'
alt-ctrl-left = 'focus left'
alt-ctrl-down = 'focus down'
alt-ctrl-up = 'focus up'
alt-ctrl-right = 'focus right'

# Move windows in workspace (alt + shift + ctrl + hjkl/arrows)
alt-shift-ctrl-h = 'move left'
alt-shift-ctrl-j = 'move down'
alt-shift-ctrl-k = 'move up'
alt-shift-ctrl-l = 'move right'
alt-shift-ctrl-left = 'move left'
alt-shift-ctrl-down = 'move down'
alt-shift-ctrl-up = 'move up'
alt-shift-ctrl-right = 'move right'

# Resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Workspace navigation
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# -----------------------------
# Workspace to Monitor Assignment
# -----------------------------
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'secondary'
4 = 'secondary'
