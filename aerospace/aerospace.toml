# -----------------------------
# AeroSpace Configuration File
# -----------------------------

# Start AeroSpace at login
start-at-login = true

# -----------------------------
# Startup Commands
# -----------------------------
# after-startup-command = ['exec-and-forget sketchybar']

# Notify Sketchybar about workspace change
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  # 'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=0',
]

# -----------------------------
# Normalization
# -----------------------------
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# -----------------------------
# Layout Defaults
# -----------------------------
accordion-padding = 0
default-root-container-layout = 'tiles'     # tiles | accordion
default-root-container-orientation = 'auto' # horizontal | vertical | auto

# -----------------------------
# Mouse / Focus Behavior
# -----------------------------
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = true

# -----------------------------
# Key Mapping
# -----------------------------
[key-mapping]
preset = 'qwerty'

# -----------------------------
# Gaps (pixels)
# -----------------------------
[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 5
outer.right = 5
outer.bottom = 5
outer.top = 5

# -----------------------------
# Main Binding Mode
# -----------------------------
[mode.main.binding]
# Layout
alt-ctrl-shift-f = 'fullscreen'
alt-ctrl-f = 'layout floating tiling'
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Focus
alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'
alt-ctrl-left = 'focus-monitor left'
alt-ctrl-right = 'focus-monitor right'
alt-ctrl-up = 'focus-monitor up'
alt-ctrl-down = 'focus-monitor down'

# Move
alt-shift-left = 'move left'
alt-shift-down = 'move down'
alt-shift-up = 'move up'
alt-shift-right = 'move right'
alt-shift-ctrl-left = 'move-node-to-monitor left'
alt-shift-ctrl-right = 'move-node-to-monitor right'
alt-shift-ctrl-up = 'move-node-to-monitor up'
alt-shift-ctrl-down = 'move-node-to-monitor down'

# Resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'

# Move windows to workspaces
alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'

# Workspace navigation
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Mode switching
alt-shift-semicolon = 'mode service'
alt-shift-enter = 'mode apps'

# -----------------------------
# Service Binding Mode
# -----------------------------
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# -----------------------------
# Workspace to Monitor Assignment
# -----------------------------
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'secondary'
4 = 'secondary'
