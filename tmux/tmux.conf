# ===============================
# TMUX PLUGINS
# ===============================
set -g @plugin 'tmux-plugins/tpm'                      # TMUX Plugin Manager
set -g @plugin 'tmux-plugins/tmux-sensible'            # Sensible defaults
set -g @plugin 'catppuccin/tmux#v2.1.3'               # Catppuccin theme
set -g @plugin 'christoomey/vim-tmux-navigator'       # Seamless Vim/TMUX navigation

# ===============================
# CATPPUCCIN THEME CONFIGURATION
# ===============================
set -g @catppuccin_flavor 'macchiato'                 # Options: latte, frappe, macchiato, mocha

# Window appearance
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_fill "number"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

# Status bar separators & modules
set -g @catppuccin_status_modules_right ""
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "yes"

# ===============================
# GENERAL TMUX SETTINGS
# ===============================
# Mouse support (click, resize, scroll)
set -g mouse on

# Start indices at 1
set -g base-index 1
setw -g pane-base-index 1

# Terminal & color support
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Pane splitting behavior
bind | split-window -h -c "#{pane_current_path}"    # horizontal split
bind - split-window -v -c "#{pane_current_path}"    # vertical split
set -g aggressive-resize on

# Automatic window rename
set -g automatic-rename on

# Status bar lengths
set -g status-left-length 100
set -g status-right-length 200

# Left side of status bar empty for now
set -g status-left ""

# -------------------------------
# VI-STYLE KEY BINDINGS FOR COPY MODE
# -------------------------------
setw -g mode-keys vi   # enables vim-style navigation in copy mode

# Automatically copy selection to the system clipboard when pressing 'y' in copy mode
# Detects platform (macOS / X11 / Wayland)

if-shell "uname | grep -q Darwin" \
    "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'" \
    "if-shell 'command -v wl-copy >/dev/null 2>&1' \
        'bind -T copy-mode-vi y send -X copy-pipe-and-cancel \"wl-copy\"' \
        'bind -T copy-mode-vi y send -X copy-pipe-and-cancel \"xclip -sel clip\"'"

# ===============================
# STATUS BAR MODULES (RIGHT)
# ===============================
# Built-in Catppuccin modules
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# ===============================
# KEYBINDINGS
# ===============================
# Reload TMUX config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "✅ TMUX configuration reloaded!"

# ===============================
# INITIALIZE PLUGIN MANAGER
# ===============================
run '~/.tmux/plugins/tpm/tpm'
