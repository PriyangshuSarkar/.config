# ===============================
# TMUX PLUGINS
# ===============================
set -g @plugin 'tmux-plugins/tpm'                      # TMUX Plugin Manager
set -g @plugin 'tmux-plugins/tmux-sensible'            # Sensible defaults
set -g @plugin 'christoomey/vim-tmux-navigator'       # Seamless Vim/TMUX navigation
set -g @plugin 'tmux-plugins/tmux-yank'                # Vim clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'           # Vim sessions
set -g @plugin 'tmux-plugins/tmux-continuum'          # Continuum
set -g @plugin 'sainnhe/tmux-fzf'                 # tmux-fzf

# ===============================
# THEME CONFIGURATION
# ===============================
source-file ~/.config/tmux/themes/catppuccin.conf

# ===============================
# GENERAL TMUX SETTINGS
# ===============================
# Mouse support (click, resize, scroll)
set -g mouse on

# Start indices at 1
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1

# Terminal & color support
set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -ga terminal-overrides ",*:Tc"

# Pane splitting behavior
bind | split-window -h -c "#{pane_current_path}"    # horizontal split
bind - split-window -v -c "#{pane_current_path}"    # vertical split
set -g aggressive-resize on

# Automatic window rename
set -g automatic-rename on

# Status bar lengths
set -g status-left-length 100
set -g status-right-length 200

# -------------------------------
# VI-STYLE KEY BINDINGS FOR COPY MODE
# -------------------------------
setw -g mode-keys vi   # enables vim-style navigation in copy mode

# Note: Status bar configuration is handled by theme files in themes/

# ===============================
# KEYBINDINGS
# ===============================
# Reload TMUX config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "✅ TMUX configuration reloaded!"

# ===============================
# INITIALIZE PLUGIN MANAGER
# ===============================
# Set plugin directory to system level (~/.tmux/plugins)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
run '~/.tmux/plugins/tpm/tpm'
