# ===============================
# GRUVBOX THEME CONFIGURATION
# ===============================

# Plugin (built on catppuccin base)
set -g @plugin 'z3z1ma/tmux-gruvbox'

# Theme flavor
set -g @gruvbox_flavour 'dark'                     # Options: dark, light

# Window appearance
set -g @gruvbox_window_status_style "basic"
set -g @gruvbox_window_number_position "right"
set -g @gruvbox_window_default_fill "number"
set -g @gruvbox_window_default_text "#W"
set -g @gruvbox_window_current_fill "number"
set -g @gruvbox_window_current_text "#W"
set -g @gruvbox_window_left_separator ""
set -g @gruvbox_window_middle_separator " █"
set -g @gruvbox_window_right_separator ""

# Status bar separators & modules (straight lines)
set -g @gruvbox_status_modules_right ""
set -g @gruvbox_status_left_separator "█"
set -g @gruvbox_status_middle_separator ""
set -g @gruvbox_status_right_separator "█"
set -g @gruvbox_status_right_separator_inverse "yes"
set -g @gruvbox_status_fill "icon"
set -g @gruvbox_status_connect_separator "yes"

# Status bar modules (matching catppuccin layout)
set -g @gruvbox_status_modules_right "application directory session uptime date_time"
