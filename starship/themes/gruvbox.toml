# ──────────────────────────────
# 🌍 Global Settings
# ──────────────────────────────

palette = 'gruvbox_dark'

format = """
$directory\
$git_status\
$git_branch\
$git_state\
$line_break\
$line_break\
$character
"""

# ──────────────────────────────
# 📁 Core Segments
# ──────────────────────────────

[directory]
truncation_length = 4
style = "fg:color_bg1 bg:color_orange"
format = "[ $path ]($style)"

[git_status]
style = "fg:color_fg0 bg:color_bg3"
format = "[ $all_status$ahead_behind ]($style)"

[git_branch]
style = "fg:color_bg1 bg:color_blue"
format = "[ $branch ]($style)"

# ──────────────────────────────
# 💻 UI / Visual
# ──────────────────────────────

[character]
disabled = false
success_symbol = "[❯](bold fg:color_green)"
error_symbol = "[❯](bold fg:color_red)"
vimcmd_symbol = "[❮](bold fg:color_green)"

vimcmd_replace_one_symbol = "[❮](bold fg:color_purple)"
vimcmd_replace_symbol = "[❮](bold fg:color_purple)"
vimcmd_visual_symbol = "[❮](bold fg:color_yellow)"

# ──────────────────────────────
# 🎨 Color Palette (Gruvbox Dark)
# ──────────────────────────────

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'
